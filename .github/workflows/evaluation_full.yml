name: V1.12 evaluation_full gate

on:
  workflow_dispatch:
    inputs:
      label_pack_id:
        description: >-
          Existing active sealed label-pack identifier in the provisioned
          release-evaluation database. This is never generated by CI.
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluation_full:
    # The official 120-case corpus and encrypted label pack are external
    # governed material. They must be provisioned on this dedicated runner;
    # a hosted runner must never be treated as if it contained them.
    runs-on: [self-hosted, worldpulse-release-evaluation]
    environment: release-evaluation
    env:
      WORLDPULSE_V112_LABEL_PACK_ID: ${{ inputs.label_pack_id }}
      WORLDPULSE_BLIND_LABEL_KEYS: ${{ secrets.WORLDPULSE_BLIND_LABEL_KEYS }}
      WORLDPULSE_DB_PATH: ${{ vars.WORLDPULSE_EVALUATION_DB_PATH }}
      WORLDPULSE_BENCHMARK_ROOT: ${{ vars.WORLDPULSE_BENCHMARK_ROOT }}
      # The release database is provisioned and reviewed outside CI.  Keep the
      # evaluator read/append-only with respect to schema: drift must fail the
      # gate instead of silently applying migrations to governed material.
      WORLDPULSE_AUTO_MIGRATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Refuse missing external evaluation material
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WORLDPULSE_V112_LABEL_PACK_ID:-}" || {
            echo "label_pack_id input is required" >&2
            exit 1
          }
          test -n "${WORLDPULSE_BLIND_LABEL_KEYS:-}" || {
            echo "WORLDPULSE_BLIND_LABEL_KEYS environment secret is required" >&2
            exit 1
          }
          test -n "${WORLDPULSE_DB_PATH:-}" || {
            echo "WORLDPULSE_EVALUATION_DB_PATH environment variable is required" >&2
            exit 1
          }
          test -f "$WORLDPULSE_DB_PATH" || {
            echo "Provisioned evaluation database is missing: $WORLDPULSE_DB_PATH" >&2
            exit 1
          }
          test -n "${WORLDPULSE_BENCHMARK_ROOT:-}" || {
            echo "WORLDPULSE_BENCHMARK_ROOT environment variable is required" >&2
            exit 1
          }
          test -d "$WORLDPULSE_BENCHMARK_ROOT" || {
            echo "Provisioned benchmark root is missing: $WORLDPULSE_BENCHMARK_ROOT" >&2
            exit 1
          }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.services.evaluation import benchmark

          workspace = Path(os.environ.get("GITHUB_WORKSPACE", "")).resolve()
          for variable in ("WORLDPULSE_DB_PATH", "WORLDPULSE_BENCHMARK_ROOT"):
              configured = Path(os.environ[variable]).expanduser()
              if not configured.is_absolute():
                  raise SystemExit(f"{variable} must be an absolute external path")
              resolved = configured.resolve(strict=False)
              try:
                  resolved.relative_to(workspace)
              except ValueError:
                  continue
              raise SystemExit(f"{variable} must remain outside GITHUB_WORKSPACE")

          pack_id = os.environ["WORLDPULSE_V112_LABEL_PACK_ID"].strip()
          verification = benchmark.verify_benchmarks()
          if verification.get("status") != "ok" or verification.get("case_count") != 120:
              raise SystemExit(
                  "evaluation_full requires an available, verified 120-case corpus; "
                  f"received {verification!r}"
              )
          pack = benchmark.get_label_pack("org_default", pack_id)
          if pack.status != "active":
              raise SystemExit(f"sealed label pack {pack_id!r} is not active: {pack.status!r}")
          if pack.suite_id != "historical-benchmark.v1" or pack.case_count != 30:
              raise SystemExit(f"sealed label pack {pack_id!r} does not match the release suite")
          try:
              keys = json.loads(os.environ["WORLDPULSE_BLIND_LABEL_KEYS"])
          except json.JSONDecodeError as exc:
              raise SystemExit("WORLDPULSE_BLIND_LABEL_KEYS must be a JSON object") from exc
          if not isinstance(keys, dict) or not keys.get(pack.encryption_key_id):
              raise SystemExit(f"decryption key for sealed label pack {pack_id!r} is unavailable")
          print(json.dumps({"status": "ok", "case_count": 120, "label_pack_id": pack_id}))
          PY
      - name: Run release evaluation (414 members)
        run: >-
          python -m app.manage evaluation run-release --provider mock
          --label-pack "$WORLDPULSE_V112_LABEL_PACK_ID" --wait
      - name: Assert evaluation_full marker and final verification
        run: |
          python -m pytest -q tests/test_evaluation_v112_integrity.py -m evaluation_full
          python -m app.manage evaluation verify
