name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worldpulse
          POSTGRES_PASSWORD: worldpulse-ci
          POSTGRES_DB: worldpulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldpulse -d worldpulse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Verify numbered migrations
        env:
          WORLDPULSE_DB_PATH: data/ci-migration.db
          WORLDPULSE_AUTO_MIGRATE: "1"
        run: |
          python -m app.manage migrate
          python -m app.manage migrate verify
      - name: Python compile
        run: python -m compileall app
      - name: V2 boundary check
        run: python scripts/verify_v2_boundaries.py
      - name: V2 lint and type ratchet
        run: |
          python -m ruff check app/main.py app/api/dependencies.py app/api/routes.py app/api/v3.py app/api/v4.py app/api/v5.py app/api/v6.py app/api/v7.py app/api/v8.py app/api/v9.py app/api/v10.py app/api/v11.py app/services/ai_analysis.py app/services/calibration.py app/services/event_digest.py app/services/hybrid_simulation/runner.py app/services/negotiation/__init__.py app/services/negotiation/application.py app/services/negotiation/engine.py app/services/negotiation/ports.py app/services/negotiation/replay.py app/services/simulation_engine.py app/services/simulation_runtime/application.py app/services/simulation_runtime/ports.py app/services/world_model/application.py app/services/world_model/ports.py app/services/identity/application.py app/services/identity/ports.py app/services/evaluation/coordinator.py app/services/evaluation/gates.py app/services/evaluation/mappers.py app/services/evaluation/metrics.py app/services/evaluation/ports.py app/services/evidence/application.py app/services/evidence/hashing.py app/services/evidence/mappers.py app/services/evidence/ports.py app/services/evidence/repository.py app/services/project_app/application.py app/services/project_app/service.py app/services/project_app/diffing.py app/services/project_app/workspace.py app/services/project_app/reports.py app/services/project_app/war_room_persistence.py app/services/project_app/replay_pack.py app/services/project_app/ports.py app/services/project_app/read_models.py app/services/project_app/replay_application.py app/services/project_app/report_application.py app/services/run_lifecycle/executor.py app/services/run_lifecycle/artifacts.py app/services/run_lifecycle/integrity.py app/services/run_lifecycle/mappers.py app/services/run_lifecycle/ports.py app/services/run_lifecycle/read_models.py app/services/scenario_compiler/application.py app/services/scenario_compiler/ports.py scripts/verify_v2_boundaries.py tests/test_v2_boundaries.py tests/test_v2_identity_port.py tests/test_v2_world_model_port.py tests/test_v2_simulation_runtime_port.py tests/test_v2_negotiation_read_port.py tests/test_v2_evaluation_boundaries.py tests/test_v2_evaluation_mappers.py tests/test_v2_evidence_persistence.py tests/test_v2_evidence_port.py tests/test_v2_run_control_persistence.py tests/test_v2_run_control_port.py tests/test_v2_scenario_compiler_port.py tests/test_v2_workspace_port.py
          python -m mypy --follow-imports=skip app/main.py app/api/dependencies.py app/api/routes.py app/api/v3.py app/api/v5.py app/api/v7.py app/api/v11.py app/services/ai_analysis.py app/services/calibration.py app/services/event_digest.py app/services/hybrid_simulation/runner.py app/services/negotiation/application.py app/services/negotiation/engine.py app/services/negotiation/ports.py app/services/negotiation/replay.py app/services/simulation_engine.py app/services/simulation_runtime/application.py app/services/simulation_runtime/ports.py app/services/world_model/application.py app/services/world_model/ports.py app/services/identity/application.py app/services/identity/ports.py app/services/evaluation/coordinator.py app/services/evaluation/gates.py app/services/evaluation/mappers.py app/services/evaluation/metrics.py app/services/evaluation/observation.py app/services/evaluation/ports.py app/services/evidence/application.py app/services/evidence/hashing.py app/services/evidence/mappers.py app/services/evidence/ports.py app/services/evidence/repository.py app/services/project_app/application.py app/services/project_app/service.py app/services/project_app/diffing.py app/services/project_app/workspace.py app/services/project_app/reports.py app/services/project_app/war_room_persistence.py app/services/project_app/replay_pack.py app/services/project_app/ports.py app/services/project_app/read_models.py app/services/project_app/replay_application.py app/services/project_app/report_application.py app/services/run_lifecycle/executor.py app/services/run_lifecycle/artifacts.py app/services/run_lifecycle/integrity.py app/services/run_lifecycle/mappers.py app/services/run_lifecycle/ports.py app/services/run_lifecycle/read_models.py app/services/scenario_compiler/application.py app/services/scenario_compiler/ports.py scripts/verify_v2_boundaries.py
      - name: V2 Kernel contract ratchet
        run: |
          python -m ruff check app/services/simulation_kernel/*.py scripts/benchmark_v2_kernel_shadow.py scripts/benchmark_v2_lifecycle_shadow.py tests/test_v2_kernel_contracts.py tests/test_v2_kernel_event_log.py tests/test_v2_kernel_performance.py tests/test_v2_lifecycle_shadow_performance.py tests/test_v2_war_room_projection.py
          python -m mypy --follow-imports=skip app/services/simulation_kernel/*.py scripts/benchmark_v2_lifecycle_shadow.py
      - name: Python tests
        run: python -m pytest -q
      - name: Live PostgreSQL migration and concurrency gates
        env:
          WORLDPULSE_DATABASE_URL: postgresql://worldpulse:worldpulse-ci@127.0.0.1:5432/worldpulse_ci
          WORLDPULSE_TEST_POSTGRES_URL: postgresql://worldpulse:worldpulse-ci@127.0.0.1:5432/worldpulse_ci
          WORLDPULSE_AUTO_MIGRATE: "1"
        run: |
          python -m app.manage migrate
          python -m app.manage verify
          python -m pytest -q tests/test_postgres_integration_v16.py
      - name: SQLite to PostgreSQL audited transfer
        env:
          WORLDPULSE_TRANSFER_URL: postgresql://worldpulse:worldpulse-ci@127.0.0.1:5432/worldpulse_transfer
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://worldpulse:worldpulse-ci@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE worldpulse_transfer'); c.close()"
          python -m app.manage db-copy --source data/ci-migration.db --target-url "$WORLDPULSE_TRANSFER_URL"
      - name: OpenAPI snapshot
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/api/openapi.v1.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend type check
        working-directory: frontend
        run: npm run check:types
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Dependency audit
        run: |
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock
          npm --registry=https://registry.npmjs.org --prefix frontend audit --audit-level=high
      - name: Forbidden artifact and secret scan
        run: python scripts/verify_release_artifacts.py
      - name: Docker Compose smoke test
        run: |
          docker compose up -d --build
          python -c "import time,urllib.request; time.sleep(3); print(urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=10).read().decode())"
          docker compose down -v
