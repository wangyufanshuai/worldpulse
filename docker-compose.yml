services:
  api:
    build: .
    ports:
      - "${WORLDPULSE_API_PORT:-8010}:8010"
    volumes:
      - ./data:/app/data
    environment:
      WORLDPULSE_DB_PATH: /app/data/worldpulse.db
      WORLDPULSE_ENV: ${WORLDPULSE_ENV:-development}
      WORLDPULSE_AUTO_MIGRATE: ${WORLDPULSE_AUTO_MIGRATE:-1}
      WORLDPULSE_AUTH_MODE: ${WORLDPULSE_AUTH_MODE:-disabled}
      WORLDPULSE_CORS_ORIGINS: ${WORLDPULSE_CORS_ORIGINS:-http://127.0.0.1:8010}
      WORLDPULSE_REQUIRE_WORKERS: ${WORLDPULSE_REQUIRE_WORKERS:-0}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_FALLBACK_MODE: ${AGENT_FALLBACK_MODE:-mock}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.run_worker"]
    volumes:
      - ./data:/app/data
    environment:
      WORLDPULSE_DB_PATH: /app/data/worldpulse.db
      WORLDPULSE_ENV: ${WORLDPULSE_ENV:-development}
      WORLDPULSE_AUTO_MIGRATE: ${WORLDPULSE_AUTO_MIGRATE:-1}
      WORLDPULSE_AUTH_MODE: ${WORLDPULSE_AUTH_MODE:-disabled}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_FALLBACK_MODE: ${AGENT_FALLBACK_MODE:-mock}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
