[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "data",
  "frontend",
  "benchmarks/historical-benchmark.v1/work",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = "(^|/)(data|frontend|benchmarks)/"
